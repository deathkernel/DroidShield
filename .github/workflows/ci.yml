name: CI

on:
  push:
    paths:
      - "droidshield/**"
      - "tests/**"
      - "rules/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "droidshield/**"
      - "tests/**"
      - "rules/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: droidshield-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m droidshield --version
      - run: python -m droidshield --help
