name: CI

on:
  push:
    paths:
      - "droidshield/**"
      - "tests/**"
      - "rules/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "droidshield/**"
      - "tests/**"
      - "rules/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: droidshield-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
